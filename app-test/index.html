<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brethren Sunday School Presenter</title>
<meta name="description" content="كل ترانيم مدارس الأحد بفكرتها وآياتها وقصة مناسبة ليها، والكتاب المقدس">
<meta name="robots" content="noindex"><meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brethren Sunday School Presenter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Brethren Sunday School Presenter - ترانيم مدارس الأحد">
<meta property="og:description" content="كل الترانيم بفكرتها وآياتها وقصصها، والكتاب المقدس، على الموبايل ومن غير نت">
<meta property="og:image" content="https://brethrensundayschoolpresenter.github.io/preview.png?v=5">
<link rel="preload" href="../fonts/BalooBhaijaan2-VF.ttf" as="font" type="font/ttf" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:K;src:url(../fonts/BalooBhaijaan2-VF.ttf);font-weight:400 800;font-display:block}
@font-face{font-family:N;src:url(../fonts/NotoNaskh.ttf);font-display:swap}
:root{--bg:#fbfaf7;--panel:#fff;--soft:#f6f5f2;--line:#b9b9b9;--line2:#e6e4df;--txt:#111;--mut:#7a7a7a;--hi:#ffff00;--blue:#bfe3f7;--fs:19px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:K,sans-serif;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.hl{background:linear-gradient(transparent 18%,var(--hi) 18%,var(--hi) 88%,transparent 88%);padding:0 6px}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
/* top */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:2px dashed var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px}
.bar{display:flex;align-items:center;gap:10px;min-height:40px}
.bar img{width:34px;height:34px;border-radius:9px}
.brand{font-weight:800;font-size:18px;line-height:1.1;white-space:nowrap}
.brand{min-width:0}
.brand small{display:block;font-size:min(12px,3.15vw);color:var(--mut);font-weight:600;white-space:nowrap;direction:ltr;text-align:right}
.bar .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:2px solid #111;display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.ib svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--hi)}
.ib.on svg{fill:#111}
.back{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;border:2px solid #111;border-radius:12px;padding:5px 12px 5px 10px;background:#fff;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:2.4;flex:none}
.back.y{background:var(--hi)}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;border:2.5px solid #111;border-radius:14px;padding:0 12px;height:46px;background:#fff}
.search svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:17px;font-weight:700;background:transparent;min-width:0}
.search input::placeholder{color:#aaa;font-weight:600}
.search .x{font-size:22px;color:#999;padding:0 4px;display:none}
.search.has .x{display:block}
/* main */
main{padding:12px 14px calc(90px + var(--safe-b))}
.sec{font-weight:800;font-size:14px;margin:16px 2px 6px;color:#333}
.letter{display:inline-block;background:var(--hi);font-weight:800;font-size:15px;padding:0 10px;border-radius:6px;margin:14px 2px 4px}
.it{display:block;background:var(--panel);border:2px solid var(--line2);border-radius:14px;padding:10px 14px;margin-bottom:7px}
.it:active{background:#fff8c4;border-color:#e6d400}
.it .t{font-weight:800;font-size:17px;line-height:1.35}
.it .s{font-size:13.5px;color:var(--mut);margin-top:2px;line-height:1.5}
.it .s.n{font-family:N,serif;font-size:15px;color:#333;line-height:1.8}
.it .r{float:left;font-size:12px;color:var(--mut);font-weight:700;margin-top:3px}
.empty{text-align:center;color:var(--mut);font-weight:700;padding:40px 10px;line-height:1.8}
.hint{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7;color:#333;margin-bottom:10px}
.hint b{font-weight:800}
/* hymn page */
.ht{font-size:27px;font-weight:800;line-height:1.35;margin:4px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{font-size:13px;font-weight:700;color:#1f6fc5;border:1.5px solid #c9dcef;background:#f3f8fd;border-radius:999px;padding:2px 10px}
.card{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.card .lb{font-weight:800;font-size:13px;margin-bottom:4px;display:block}
.card .lb span{background:var(--hi);padding:0 6px}
.card p{margin:0;font-size:16px;line-height:1.8;font-weight:600}
.card + .card{margin-top:-2px}
.vs{display:flex;flex-direction:column;gap:7px}
.vch{display:block;border:2px solid var(--line2);border-radius:12px;padding:7px 11px;background:#fafafa;text-align:right}
.vch:active{border-color:#111}
.vch .q{font-weight:800;font-size:15.5px}
.vch .r{font-size:12.5px;color:var(--mut);font-weight:700}
.vch .r::after{content:" ‹ افتحها";color:#1f6fc5}
.story{cursor:pointer}
.story b{font-size:17px}
.story .r{font-size:13px;color:#1f6fc5;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lyr{margin-top:14px}
.vb{border-radius:16px;padding:14px 16px 16px;margin-bottom:10px;border:2px solid #ddd;font-weight:800;font-size:var(--fs);line-height:1.85;text-align:center;position:relative}
.vb.w{background:#fff}.vb.bl{background:var(--blue)}
.vb .tag{display:inline-block;font-size:12px;background:var(--hi);padding:0 7px;margin-bottom:4px;line-height:1.6}
.tools{display:flex;gap:8px;justify-content:center;margin:6px 0 2px}
.tools button{border:2px solid #111;border-radius:10px;padding:2px 14px;font-weight:800;background:#fff;font-size:15px}
/* bible */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.grid button{background:var(--panel);border:2px solid var(--line2);border-radius:12px;padding:9px 4px;font-weight:800;font-size:15px}
.grid button:active{background:var(--hi);border-color:#111}
.vl{font-family:N,serif;font-size:calc(var(--fs) - 1px);line-height:2;padding:6px 10px;border-radius:10px;border:2px solid transparent;margin-bottom:3px;background:transparent}
.vl b{font-family:K;font-size:12px;background:#ececec;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:3px}
.vl.hit{background:#fff8c4;border-color:#e6d400}
.vl.hit b{background:var(--hi)}
.cnav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}
.cnav button{flex:1;border:2px solid #111;border-radius:12px;padding:8px;font-weight:800;background:#fff}
/* topics */
.tp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tp .n{font-size:12.5px;color:var(--mut);font-weight:700;white-space:nowrap}
/* tabs */
.tabs{position:fixed;bottom:0;right:0;left:0;z-index:20;background:var(--panel);border-top:2px dashed var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:12.5px;color:#666;padding:4px 0;border-radius:12px}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:#111;background:var(--hi)}
.load{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;font-weight:800;color:#333;transition:opacity .3s}
.load span{visibility:hidden}
.load img{width:84px;height:84px;border-radius:20px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.welcome{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.welcome form{width:min(420px,100%);background:var(--panel);border:2px dashed var(--line);border-radius:20px;padding:22px 20px 18px;text-align:right}
.welcome img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 8px}
.welcome h2{margin:0;text-align:center;font-size:24px}
.welcome .en{direction:ltr;text-align:center;color:var(--mut);font-weight:700;font-size:min(13px,3.4vw);white-space:nowrap}
.welcome p{margin:10px 0 4px;font-size:15px;line-height:1.7;color:#333;text-align:center}
.welcome label{display:block;font-weight:800;font-size:15px;margin:12px 0 4px}
.welcome input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:9px 12px;border-radius:12px;border:2.5px solid #111;background:#fff;outline:none}
.welcome input:focus{background:#fffde6}
.welcome .err{color:#c62828;font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
.welcome button{width:100%;margin-top:8px;background:var(--hi);border:2.5px solid #111;border-radius:14px;padding:10px;font-weight:800;font-size:18px}
.welcome .priv{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.az{position:fixed;left:44px;top:calc(var(--azt,150px) + 6px);bottom:calc(82px + var(--safe-b));width:40px;z-index:26;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px 0;border-radius:16px;background:#fff;border:2px solid #111;box-shadow:0 10px 30px #0003;opacity:0;transform:translateX(-12px);transition:opacity .15s,transform .15s;pointer-events:none}
.az.open{opacity:1;transform:none}
.az span{font-weight:800;font-size:min(14px,2.3vh);line-height:1;color:#555;width:30px;text-align:center;padding:1px 0;border-radius:7px}
.az span.cur{background:var(--hi);color:#111;transform:scale(1.25)}
.azh{position:fixed;left:0;top:0;z-index:27;width:40px;height:52px;border-radius:0 14px 14px 0;background:var(--hi);border:2px solid #111;border-left:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;box-shadow:0 6px 18px #0003;touch-action:none;user-select:none;-webkit-user-select:none;opacity:.35;transition:opacity .25s}
.azh::before{content:"";position:absolute;right:5px;top:14px;bottom:14px;width:3px;border-radius:2px;background:#11111140}
.azh.show,.azh.act{opacity:1}
.azb{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);width:92px;height:92px;border-radius:24px;background:#111;color:var(--hi);font-weight:800;font-size:52px;display:flex;align-items:center;justify-content:center;z-index:45;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 40px #0005}
.azb.show{opacity:.92;transform:translate(-50%,-50%) scale(1)}
.lh{position:sticky;top:calc(var(--azt,150px));z-index:5;pointer-events:none;background:var(--bg);margin:8px -4px 2px;padding:5px 4px 5px}
.lh .letter{margin:0}
.sug{display:flex;align-items:center;gap:5px;height:40px;border:2px solid #111;border-radius:12px;padding:0 10px;background:var(--hi);font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.sug svg{width:19px;height:19px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:370px){.sug span{display:none}.sug{width:40px;padding:0;justify-content:center}}
.mist{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:16px 0 4px;border:2px dashed var(--line);border-radius:14px;padding:11px;background:var(--panel);font-weight:800;font-size:15px;color:#333}
.mist svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.upd-pop{position:fixed;inset:0;z-index:48;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.upd-card{width:min(400px,100%);background:#fff;border:3px solid #111;border-radius:20px;padding:18px 18px 14px;box-shadow:0 8px 0 #111;text-align:right;animation:popIn .3s cubic-bezier(.2,.8,.2,1.2)}
@keyframes popIn{from{transform:scale(.85);opacity:0}}
.upd-ic{width:54px;height:54px;border-radius:16px;background:var(--hi);border:2.5px solid #111;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 6px}
.upd-card h3{margin:0 0 10px;text-align:center;font-size:22px}
.upd-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff8c4;border:2px solid #e6d400;border-radius:12px;padding:8px 12px;margin-bottom:7px;font-weight:800;font-size:17px}
.upd-h span{font-size:13px;color:#1f6fc5;white-space:nowrap}
.upd-card ul{margin:4px 0 6px;padding-right:20px;font-size:15px;line-height:1.7;font-weight:600}
.upd-ok{width:100%;margin-top:6px;background:var(--hi);border:2.5px solid #111;border-radius:14px;padding:9px;font-weight:800;font-size:18px}
.toast{position:fixed;bottom:calc(84px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;font-weight:800;font-size:14px;padding:8px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
/* فرصي */
.newf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--hi);border:2.5px solid #111;border-radius:14px;padding:11px;font-weight:800;font-size:18px;margin:4px 0 6px;box-shadow:0 3px 0 #111}
.newf:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
.fl .t{display:flex;align-items:center;gap:8px}
.badge{font-size:11.5px;font-weight:800;background:var(--hi);border:1.5px solid #111;border-radius:999px;padding:0 8px;line-height:1.6;flex:none}
.fhead{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:10px 12px;margin:4px 0 12px}
.fhead input{font:inherit;width:100%;border:0;outline:0;background:transparent;min-width:0}
.ftitle{font-size:22px !important;font-weight:800;padding:2px 0 6px;border-bottom:2px solid var(--line2) !important}
.ftitle::placeholder{color:#bbb}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0 2px}
.frow+.frow{border-top:1px solid var(--line2)}
.frow label{font-weight:800;font-size:14px;color:#555;width:70px;flex:none}
.frow input{font-size:16px;font-weight:700}
.frow input[type=date]{direction:rtl;text-align:right;-webkit-appearance:none;appearance:none;background:#fff;border:2px solid #111;border-radius:10px;padding:4px 8px;width:auto;min-height:36px}
.frow .dl{font-size:12.5px;color:var(--mut);font-weight:700}
.fi{background:var(--panel);border:2px solid var(--line2);border-radius:14px;padding:8px 10px 8px 8px;margin-bottom:8px}
.fi-top{display:flex;align-items:flex-start;gap:8px}
.fnum{flex:none;width:26px;height:26px;border-radius:8px;background:var(--hi);border:2px solid #111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:2px}
.fi-main{flex:1;min-width:0}
.fi-main .k{font-size:11.5px;font-weight:800;color:#1f6fc5}
.fi-main .t{font-weight:800;font-size:16.5px;line-height:1.35}
.fi-main .s{font-family:N,serif;font-size:14.5px;color:#333;line-height:1.75;margin-top:2px}
.fi-act{display:flex;gap:4px;flex:none}
.fi-act button{width:30px;height:30px;border-radius:9px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;background:#fff}
.fi-act button:active{border-color:#111;background:var(--hi)}
.fi-act svg{width:16px;height:16px;stroke:#111;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fi-act button:disabled{opacity:.25}
.fnote{display:block;width:100%;margin-top:7px;font:inherit;font-size:15px;font-weight:600;line-height:1.6;border:2px dashed #d9d6cf;border-radius:10px;padding:6px 10px;background:#fffef3;outline:0;resize:none;overflow:hidden;min-height:40px}
.fnote:focus{border-color:#111;border-style:solid}
.addnote{margin-top:6px;font-size:13.5px;font-weight:800;color:#1f6fc5}
.fadd{display:flex;gap:8px;margin:6px 0 4px}
.fadd button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid #111;border-radius:13px;padding:9px 6px;font-weight:800;font-size:16px;background:#fff}
.fadd button:active{background:var(--hi)}
.fadd svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:2.4;stroke-linecap:round}
.fref{display:none;gap:8px;margin:6px 0}
.fref.on{display:flex}
.fref input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:700;border:2.5px solid #111;border-radius:12px;padding:7px 12px;outline:0;background:#fff}
.fref button{border:2.5px solid #111;border-radius:12px;padding:0 16px;font-weight:800;background:var(--hi)}
.fref-h{font-size:12.5px;color:var(--mut);font-weight:700;margin:-2px 2px 6px;display:none}
.fref.on+.fref-h{display:block}
.fnotes{display:block;width:100%;font:inherit;font-size:16px;font-weight:600;line-height:1.7;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;background:#fffef3;outline:0;resize:none;overflow:hidden;min-height:90px}
.fnotes:focus{border-color:#111;border-style:solid}
.fdel{display:block;margin:22px auto 6px;color:#c62828;font-weight:800;font-size:14px;border:2px solid #f1c4c4;border-radius:12px;padding:6px 16px;background:#fff}
.fdel.sure{background:#c62828;color:#fff;border-color:#c62828}
.addf{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;border:2.5px solid #111;border-radius:12px;padding:5px 14px;font-weight:800;font-size:15px;background:var(--hi);box-shadow:0 2px 0 #111}
.addf svg{width:17px;height:17px;stroke:#111;fill:none;stroke-width:2.4;stroke-linecap:round}
.vrow{display:flex;gap:6px;align-items:stretch}
.vrow .vch{flex:1}
.vplus{flex:none;width:40px;border:2px solid var(--line2);border-radius:12px;background:#fff;font-weight:800;font-size:22px;line-height:1}
.vplus:active{background:var(--hi);border-color:#111}
.story-add{margin-top:8px;font-size:14px}
.vl.sel{background:#fff8c4;border-color:#111}
.vsel{position:fixed;left:50%;bottom:calc(128px + var(--safe-b));transform:translateX(-50%);z-index:30;display:flex;gap:6px;align-items:center;background:#111;color:#fff;border-radius:14px;padding:6px 6px 6px 12px;box-shadow:0 8px 24px #0005;white-space:nowrap;font-weight:800;font-size:14px}
.vsel button{background:var(--hi);color:#111;border-radius:10px;padding:6px 12px;font-weight:800;font-size:15px}
.vsel .x{background:none;color:#fff;padding:6px 8px;font-size:18px}
.sheet{position:fixed;inset:0;z-index:47;background:#0006;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
.sheet-in{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;border:2.5px solid #111;border-bottom:0;padding:14px 14px calc(16px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0 0 10px;font-size:19px;text-align:center}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#ccc;margin:-4px auto 10px}
.sheet .it.last{border-color:#111}
.sheet .search{margin:0 0 10px}
.pk .it{display:flex;align-items:center;gap:10px;width:100%;text-align:right}
.pk .it .t{flex:1}
