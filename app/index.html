<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Brethren Sunday School Presenter</title>
<meta name="description" content="كل ترانيم مدارس الأحد بفكرتها وآياتها وقصة مناسبة ليها، والكتاب المقدس">
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brethren Sunday School Presenter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Brethren Sunday School Presenter - ترانيم مدارس الأحد">
<meta property="og:description" content="كل الترانيم بفكرتها وآياتها وقصصها، والكتاب المقدس، على الموبايل ومن غير نت">
<meta property="og:image" content="https://brethrensundayschoolpresenter.github.io/preview.png?v=7">
<link rel="preload" href="../fonts/BalooBhaijaan2-VF.ttf" as="font" type="font/ttf" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="icon-192.png" as="image">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem('ssw_theme')||'auto';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<style>
@font-face{font-family:K;src:url(../fonts/BalooBhaijaan2-VF.ttf);font-weight:400 800;font-display:block}
@font-face{font-family:N;src:url(../fonts/NotoNaskh.ttf);font-display:swap}
:root{--bg:#fbfaf7;--panel:#fff;--soft:#f6f5f2;--line:#b9b9b9;--line2:#e6e4df;--txt:#111;--mut:#7a7a7a;--hi:#ffff00;--blue:#bfe3f7;--fs:19px;--safe-b:env(safe-area-inset-bottom,0px);--ink:#111;--txt2:#333;--hiSoft:#fff8c4;--blueSoft:#f3f8fd;--blueLine:#c9dcef;--link:#1f6fc5;--greenSoft:#effbea;--onhi:#111}
:root[data-theme=dark]{--bg:#0f141a;--panel:#18202a;--soft:#1e2731;--line:#4a5563;--line2:#2a3440;--txt:#eef2f6;--mut:#98a3b0;--hi:#ffe14d;--blue:#1f4d6b;--ink:#dfe6ee;--txt2:#cfd6de;--hiSoft:#3a3412;--blueSoft:#16263a;--blueLine:#2d4a6b;--link:#7db8ff;--greenSoft:#163020;color-scheme:dark}
:root[data-theme=dark] :is(.letter,.badge,.fnum,.upd-ic,.upd-ok,.newf,.addf,.sug,.azh,.welcome button,.tabs a.on,.ib.on,.back.y,.keyl,#fbar button,#kbar button.on,.golyr.gkey,.vsel button,.fref button,.cl-news .cl-gbtn,.cl-news .cl-new,.cloud .cl-b,.card .lb span,.vb .tag,mark,.hl,.fbk-b button:first-child,.grid button:active,.seg button.on){color:var(--onhi)}
:root[data-theme=dark] .golyr.gkey small{color:#333}
:root[data-theme=dark] img[src$="icon-192.png"]{filter:none}
/* segmented control (Bible) */
.seg{display:flex;gap:6px;background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:4px;margin:10px 0 12px;position:sticky;top:calc(var(--azt,112px) + 6px);z-index:6}
.seg button{flex:1;border-radius:10px;padding:8px 6px;font-weight:800;font-size:16px;color:var(--mut);transition:background .2s,color .2s}
.seg button.on{background:var(--hi);color:var(--onhi)}
/* motion (short and soft; off when the phone asks for less motion) */
@keyframes bIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#main.anim{animation:bIn .22s ease-out}
.fadein{animation:bIn .2s ease-out}
.upd,.welcome>div,.cl-news{animation:bPop .22s ease-out}
@media (prefers-reduced-motion:reduce){#splash .spi{opacity:1}#main.anim,.fadein,.upd,.welcome>div,.cl-news,#splash{animation:none!important;transition:none!important}}
/* compact font buttons */
.tools.tsz{justify-content:flex-start;gap:6px}
.tools.tsz button{width:42px;height:34px;padding:0;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;gap:1px}
.tools.tsz button.big{font-size:22px}
.tools.tsz sub{font-size:12px;vertical-align:0;font-weight:800}
.tools button.on{background:var(--hi);color:var(--onhi)}
/* last searches */
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 10px}
.recent .rl{font-size:12.5px;color:var(--mut);font-weight:700}
.recent button{border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;background:var(--panel)}
.recent .rx{border:0;color:var(--mut);font-size:18px;padding:0 6px;background:none}
/* swipe rows */
.swr{position:relative;margin-bottom:7px;border-radius:14px;overflow:hidden}
.swr .it{margin-bottom:0}
.swc{position:relative;z-index:1;transition:transform .22s ease;background:var(--bg);touch-action:pan-y}
.swa{position:absolute;top:0;bottom:0;right:0;display:flex;z-index:0}
.swa button{width:78px;font-weight:800;font-size:15px;color:#fff}
.swa .sw-del,.swa .sw-rm{background:#d64545}
.swa .sw-dup{background:#3f7fd6}
.swr.gone{display:none}
/* reorder favourites */
.ordr{display:flex;align-items:stretch;gap:6px;margin-bottom:7px}
.ordr .it{flex:1;margin:0}
.ordr .ob{display:flex;flex-direction:column;gap:4px}
.ordr .ob button{flex:1;width:40px;border:2px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.ordr .ob button:disabled{opacity:.3}
.ordr .ob svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4}
/* undo bar */
.undo{position:fixed;left:12px;right:12px;bottom:calc(86px + var(--safe-b));z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--panel);border-radius:14px;padding:10px 14px;font-weight:800;animation:bIn .2s ease-out}
.undo button{color:var(--hi);font-weight:800;font-size:16px;padding:2px 6px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .35s ease}
#splash .spi{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
#splash .spi.go{animation:bPop .35s ease-out forwards}
#splash img{width:96px;height:96px;border-radius:24px}
#splash b{font-size:24px;font-weight:800;color:var(--txt);font-family:-apple-system,system-ui,'Segoe UI',Tahoma,sans-serif}
#splash small{font-size:13px;color:var(--mut);direction:ltr;font-family:-apple-system,system-ui,'Segoe UI',sans-serif}
#splash.out{opacity:0;pointer-events:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{padding-top:var(--azt,112px)}
html:has(.upd-pop),html:has(.upd-pop) body{overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:K,sans-serif;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.hl{background:linear-gradient(transparent 18%,var(--hi) 18%,var(--hi) 88%,transparent 88%);padding:0 6px}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:20;transform:translateZ(0);-webkit-transform:translateZ(0);background:var(--panel);border-bottom:2px dashed var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px}
.bar{display:flex;align-items:center;gap:10px;min-height:40px}
.bar img{width:34px;height:34px;border-radius:9px}
.brand{font-weight:800;font-size:18px;line-height:1.1;white-space:nowrap}
.brand{min-width:0}
.brand small{display:block;font-size:min(12px,3.15vw);color:var(--mut);font-weight:600;white-space:nowrap;direction:ltr;text-align:right}
.bar .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--panel);flex:none}
.ib svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--hi)}
.ib.on svg{fill:var(--ink)}
.back{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:5px 12px 5px 10px;background:var(--panel);max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4;flex:none}
.back.y{background:var(--hi);max-width:100%}
.back span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:14px;padding:0 12px;height:46px;background:var(--panel)}
.search svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:17px;font-weight:700;background:transparent;min-width:0}
.search input::placeholder{color:var(--mut);font-weight:600}
.search .x{font-size:22px;color:var(--mut);padding:0 4px;display:none}
.search.has .x{display:block}
/* main */
main{padding:12px 14px calc(90px + var(--safe-b))}
.sec{font-weight:800;font-size:14px;margin:16px 2px 6px;color:var(--txt2)}
.letter{display:inline-block;background:var(--hi);font-weight:800;font-size:15px;padding:0 10px;border-radius:6px;margin:14px 2px 4px}
.it{display:block;background:var(--panel);border:2px solid var(--line2);border-radius:14px;padding:10px 14px;margin-bottom:7px}
.it:active{background:var(--hiSoft);border-color:#e6d400}
.it .t{font-weight:800;font-size:17px;line-height:1.35}
.it .s{font-size:13.5px;color:var(--mut);margin-top:2px;line-height:1.5}
.it .s.n{font-family:N,serif;font-size:15px;color:var(--txt2);line-height:1.8}
.it .r{float:left;font-size:12px;color:var(--mut);font-weight:700;margin-top:3px}
.empty{text-align:center;color:var(--mut);font-weight:700;padding:40px 10px;line-height:1.8}
.cloud{border:2.5px solid var(--ink);background:var(--blueSoft);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.cloud.on{background:var(--greenSoft)}
.cloud .cl-t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cloud .cl-b{font-size:11.5px;background:var(--hi);border:1.5px solid var(--ink);border-radius:8px;padding:0 7px}
.cloud .cl-s{font-size:14px;color:var(--txt2);line-height:1.7;margin:4px 0 8px}
.cloud .cl-go{width:100%;font:inherit;font-weight:800;font-size:17px;background:var(--panel);border:2.5px solid var(--ink);border-radius:12px;padding:8px}
.cloud .cl-back{display:block;width:100%;margin-top:8px;background:none;border:0;font:inherit;font-weight:700;font-size:14px;color:var(--link);text-decoration:underline}
.cloud .cl-row{display:flex;gap:8px}.cloud .cl-row button{flex:1;font:inherit;font-weight:700;font-size:14.5px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:5px}
.hint{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7;color:var(--txt2);margin-bottom:10px}
.hint b{font-weight:800}
/* hymn page */
.ht{font-size:27px;font-weight:800;line-height:1.35;margin:4px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{font-size:13px;font-weight:700;color:var(--link);border:1.5px solid var(--blueLine);background:var(--blueSoft);border-radius:999px;padding:2px 10px}
.card{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.card .lb{font-weight:800;font-size:13px;margin-bottom:4px;display:block}
.card .lb span{background:var(--hi);padding:0 6px}
.card p{margin:0;font-size:16px;line-height:1.8;font-weight:600}
.card + .card{margin-top:-2px}
.vs{display:flex;flex-direction:column;gap:7px}
.vch{display:block;border:2px solid var(--line2);border-radius:12px;padding:7px 11px;background:var(--soft);text-align:right}
.vch:active{border-color:var(--ink)}
.vch .q{font-weight:800;font-size:15.5px}
.vch .r{font-size:12.5px;color:var(--mut);font-weight:700}
.vch .r::after{content:" ‹ افتحها";color:var(--link)}
.story{cursor:pointer}
.story b{font-size:17px}
.story .r{font-size:13px;color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lyr{margin-top:14px}
.vb{border-radius:16px;padding:14px 16px 16px;margin-bottom:10px;border:2px solid var(--line2);font-weight:800;font-size:var(--fs);line-height:1.85;text-align:center;position:relative}
.vb.w{background:var(--panel)}.vb.bl{background:var(--blue)}
.vb .tag{display:inline-block;font-size:12px;background:var(--hi);padding:0 7px;margin-bottom:4px;line-height:1.6}
.tools{display:flex;gap:8px;justify-content:center;margin:6px 0 2px}
.tools button{border:2px solid var(--ink);border-radius:10px;padding:2px 14px;font-weight:800;background:var(--panel);font-size:15px}
/* bible */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.grid button{background:var(--panel);border:2px solid var(--line2);border-radius:12px;padding:9px 4px;font-weight:800;font-size:15px}
.grid button:active{background:var(--hi);border-color:var(--ink)}
.vl{font-family:N,serif;font-size:calc(var(--fs) - 1px);line-height:2;padding:6px 10px;border-radius:10px;border:2px solid transparent;margin-bottom:3px;background:transparent}
.vl b{font-family:K;font-size:12px;background:var(--line2);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:3px}
.vl.hit{background:var(--hiSoft);border-color:#e6d400}
.vl.hit b{background:var(--hi)}
.cnav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}
.cnav button{flex:1;border:2px solid var(--ink);border-radius:12px;padding:8px;font-weight:800;background:var(--panel)}
/* topics */
.tp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tp .n{font-size:12.5px;color:var(--mut);font-weight:700;white-space:nowrap}
/* tabs */
body.typing .tabs{display:none}
#kbar{margin-top:8px}#kbar button{width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:8px 6px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:15px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
#kbar button.on{background:var(--hi)}
.keyl{display:inline-block;margin:4px 0 10px;font-weight:800;font-size:16px;background:var(--hi);border:2px solid var(--ink);border-radius:10px;padding:3px 12px;direction:ltr}
.keyl span{font-weight:700;color:#444;margin-left:8px}
.ik{float:left;direction:ltr;font-weight:800;font-size:12.5px;background:var(--hiSoft);border:1.5px solid var(--line);border-radius:7px;padding:0 6px;margin-top:2px}
#fbar{display:flex;gap:8px;margin-top:8px}
#fbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2.5px solid var(--ink);border-radius:14px;padding:7px 6px;background:var(--hi);color:var(--ink);font-family:inherit;box-shadow:0 3px 0 var(--ink);line-height:1.3}
#fbar button b{font-size:15px;font-weight:800}#fbar button small{font-size:11.5px;font-weight:600}
body.typing #fbar{display:none}
.fpc{cursor:default}
.tabs{position:fixed;bottom:0;right:0;left:0;z-index:20;transform:translateZ(0);background:var(--panel);border-top:2px dashed var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:12.5px;color:var(--txt2);padding:4px 0;border-radius:12px}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--ink);background:var(--hi)}
.load{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;font-weight:800;color:var(--txt2);transition:opacity .3s}
.load span{visibility:hidden}
.load img{width:84px;height:84px;border-radius:20px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.welcome{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.welcome form{width:min(420px,100%);background:var(--panel);border:2px dashed var(--line);border-radius:20px;padding:22px 20px 18px;text-align:right}
.welcome img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 8px}
.welcome h2{margin:0;text-align:center;font-size:24px}
.welcome .en{direction:ltr;text-align:center;color:var(--mut);font-weight:700;font-size:min(13px,3.4vw);white-space:nowrap}
.welcome p{margin:10px 0 4px;font-size:15px;line-height:1.7;color:var(--txt2);text-align:center}
.welcome label{display:block;font-weight:800;font-size:15px;margin:12px 0 4px}
.welcome input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:9px 12px;border-radius:12px;border:2.5px solid var(--ink);background:var(--panel);outline:none}
.welcome input:focus{background:var(--hiSoft)}
.welcome .err{color:#c62828;font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
.welcome button{width:100%;margin-top:8px;background:var(--hi);border:2.5px solid var(--ink);border-radius:14px;padding:10px;font-weight:800;font-size:18px}
.welcome .priv{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.az{position:fixed;left:44px;top:calc(var(--azt,150px) + 6px);bottom:calc(82px + var(--safe-b));width:40px;z-index:26;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px 0;border-radius:16px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 10px 30px #0003;opacity:0;transform:translateX(-12px);transition:opacity .15s,transform .15s;pointer-events:none}
.az.open{opacity:1;transform:none}
.az span{font-weight:800;font-size:min(14px,2.3vh);line-height:1;color:var(--txt2);width:30px;text-align:center;padding:1px 0;border-radius:7px}
.az span.cur{background:var(--hi);color:var(--ink);transform:scale(1.25)}
.azh{position:fixed;left:0;top:0;z-index:27;width:40px;height:52px;border-radius:0 14px 14px 0;background:var(--hi);border:2px solid var(--ink);border-left:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;box-shadow:0 6px 18px #0003;touch-action:none;user-select:none;-webkit-user-select:none;opacity:.35;transition:opacity .25s}
.azh::before{content:"";position:absolute;right:5px;top:14px;bottom:14px;width:3px;border-radius:2px;background:#11111140}
.azh.show,.azh.act{opacity:1}
.azb{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);width:92px;height:92px;border-radius:24px;background:#111;color:#ffe600;font-weight:800;font-size:52px;display:flex;align-items:center;justify-content:center;z-index:45;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 40px #0005}
.azb.show{opacity:.92;transform:translate(-50%,-50%) scale(1)}
.lh{position:sticky;top:calc(var(--azt,150px));z-index:5;pointer-events:none;background:var(--bg);margin:8px -4px 2px;padding:5px 4px 5px}
.lh .letter{margin:0}
.sug{display:flex;align-items:center;gap:5px;height:40px;border:2px solid var(--ink);border-radius:12px;padding:0 10px;background:var(--hi);font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.sug svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:370px){.sug span{display:none}.sug{width:40px;padding:0;justify-content:center}}
.mist{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:16px 0 4px;border:2px dashed var(--line);border-radius:14px;padding:11px;background:var(--panel);font-weight:800;font-size:15px;color:var(--txt2)}
.mist svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cl-news{position:relative;width:min(400px,100%);background:linear-gradient(160deg,#2f7cf6 0%,#1b4fb3 100%);color:var(--panel);border:3px solid var(--ink);border-radius:24px;padding:26px 20px 16px;box-shadow:0 8px 0 var(--ink);text-align:center;animation:popIn .35s cubic-bezier(.2,.8,.2,1.2)}
